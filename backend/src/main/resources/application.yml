spring:
  application:
    name: ticketease-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ticketease}
    username: ${DATABASE_USERNAME:ticketease}
    password: ${DATABASE_PASSWORD:ticketease}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

  mail:
    from: ${MAIL_FROM:no-reply@ticketease.demo}
    enabled: ${MAIL_ENABLED:false}

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

  booking:
    seat-hold-minutes: ${SEAT_HOLD_MINUTES:5}
    cancellation-cutoff-hours: ${CANCELLATION_CUTOFF_HOURS:2}

  payment:
    mode: ${PAYMENT_MODE:mock}

  qr:
    secret: ${QR_SECRET:change-this-qr-signing-secret}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/oauth/callback}
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}

  notification:
    max-retry-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.ticketease: INFO
    org.hibernate.SQL: WARN
